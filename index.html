<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4 - Tabelas em HTML e CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- TABELA: Rotina Semanal -->
        <section class="tabela-section">
            <h1>Rotina Semanal</h1>

                <caption>Horário de Rotina da Semana</caption>
                <thead>
                    <tr>
                        <th class="horario">Horário</th>
                        <th>DOM</th>
                        <th>SEG</th>
                        <th>TER</th>
                        <th>QUA</th>
                        <th>QUI</th>
                        <th>SEX</th>
                        <th>SAB</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="periodo">MANHÃ</td>
                        <td>Descanso</td>
                        <td>Trabalho</td>
                        <td>Trabalho</td>
                        <td>Trabalho</td>
                        <td>Trabalho</td>
                        <td>Trabalho</td>
                        <td>Lazer</td>
                    </tr>
                    <tr>
                        <td class="periodo">TARDE</td>
                        <td>Descanso</td>
                        <td>Trabalho</td>
                        <td>Trabalho</td>
                        <td>Trabalho</td>
                        <td>Trabalho</td>
                        <td>Trabalho</td>
                        <td>Lazer</td>
                    </tr>
                    <tr>
                        <td class="periodo">NOITE</td>
                        <td>Descanso</td>
                        <td>Faculdade</td>
                        <td>Faculdade</td>
                        <td>Faculdade</td>
                        <td>Faculdade</td>
                        <td>Descanso</td>
                        <td>Lazer</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
